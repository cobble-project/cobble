<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 816" role="img" aria-labelledby="snapshot-reader-title snapshot-reader-desc">
<title id="snapshot-reader-title">Snapshot-following read service</title>
<desc id="snapshot-reader-desc">Writer and reader processes exchange published checkpoints through a full-width shared storage layer.</desc>
