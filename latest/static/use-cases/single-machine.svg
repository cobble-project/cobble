<marker id="arrow-link" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#3f6579"/></marker></defs>
<rect x="0" y="0" width="1280" height="816" rx="0" fill="#faf8f3" stroke="none" stroke-width="1.4"/>
<rect x="48" y="36" width="36" height="4" rx="0" fill="#89643b" stroke="none" stroke-width="1.4"/><text x="96" y="44" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#655f55" font-weight="600" text-anchor="start">COBBLE / 01</text><text x="48" y="92" font-family="Georgia, serif" font-size="36" fill="#302d28" font-weight="400" text-anchor="start">Single-machine embedded database</text><text x="48" y="128" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#655f55" font-weight="400" text-anchor="start">Local working set, remote durability, and on-demand cache loading.</text>
