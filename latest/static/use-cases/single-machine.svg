<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 816" role="img" aria-labelledby="single-machine-title single-machine-desc">
<title id="single-machine-title">Single-machine embedded database</title>
<desc id="single-machine-desc">Cobble writes daily SSTs to local disk and writes the global manifest remotely. Local SSTs are offloaded to remote storage for checkpoints or capacity pressure, and remote SST blocks are loaded back into the isolated local data cache on demand.</desc>
