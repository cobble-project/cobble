name: Build Java Multi-platform JAR

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPECTED_NATIVE_FILES: |
    native/macos-aarch64/debug/libcobblejni.dylib
    native/macos-aarch64/debug/cobble-cli
    native/macos-aarch64/release/libcobblejni.dylib
    native/macos-aarch64/release/cobble-cli
    native/macos-x86_64/debug/libcobblejni.dylib
    native/macos-x86_64/debug/cobble-cli
    native/macos-x86_64/release/libcobblejni.dylib
    native/macos-x86_64/release/cobble-cli
    native/linux-x86_64/debug/libcobblejni.so
    native/linux-x86_64/debug/cobble-cli
    native/linux-x86_64/release/libcobblejni.so
    native/linux-x86_64/release/cobble-cli
    native/linux-aarch64/debug/libcobblejni.so
    native/linux-aarch64/debug/cobble-cli
    native/linux-aarch64/release/libcobblejni.so
    native/linux-aarch64/release/cobble-cli
    native/windows-x86_64/debug/cobblejni.dll
    native/windows-x86_64/debug/cobble-cli.exe
    native/windows-x86_64/release/cobblejni.dll
    native/windows-x86_64/release/cobble-cli.exe

jobs:
  prepare:
    name: Prepare build
    runs-on: ubuntu-latest
    outputs:
      checkout_sha: ${{ steps.prepare.outputs.checkout_sha }}
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Read project version
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          version="$(
            python3 - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("cobble-java/java/pom.xml").getroot()
          namespace = {"m": "http://maven.apache.org/POM/4.0.0"}
          version = root.findtext("m:version", namespaces=namespace)
          if not version:
              raise SystemExit("Missing project version in cobble-java/java/pom.xml")
          print(version.strip())
          PY
          )"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${version}" != *-SNAPSHOT ]]; then
            echo "Refusing to publish non-SNAPSHOT version from branch '${GITHUB_REF_NAME}': ${version}" >&2
            exit 1
          fi

          {
            echo "checkout_sha=${checkout_sha}"
            echo "version=${version}"
          } >> "${GITHUB_OUTPUT}"

  build-native:
    name: Build native ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-aarch64
            runner: macos-26
            target: aarch64-apple-darwin
            lib_file: libcobblejni.dylib
            cli_file: cobble-cli
            build_features: storage-all
          - platform: macos-x86_64
            runner: macos-26-intel
            target: x86_64-apple-darwin
            lib_file: libcobblejni.dylib
            cli_file: cobble-cli
            build_features: storage-all
          - platform: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            lib_file: libcobblejni.so
            cli_file: cobble-cli
            build_features: storage-all
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            lib_file: libcobblejni.so
            cli_file: cobble-cli
            build_features: storage-all
          - platform: windows-x86_64
            runner: windows-2025-vs2026
            target: x86_64-pc-windows-msvc
            lib_file: cobblejni.dll
            cli_file: cobble-cli.exe
            # Windows currently doesn't support these OpenDAL backends in our build:
            # - storage-sftp (openssh crate is unix-only)
            # - storage-hdfs (depends on unix-only libc constants)
            build_features: storage-alluxio,storage-cos,storage-ftp,storage-oss,storage-s3

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.checkout_sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Build debug + release native binaries
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p cobble-java --features "${{ matrix.build_features }}" --target "${{ matrix.target }}"
          cargo build -p cobble-cli --features "${{ matrix.build_features }}" --target "${{ matrix.target }}"
          cargo build -p cobble-java --features "${{ matrix.build_features }}" --target "${{ matrix.target }}" --release
          cargo build -p cobble-cli --features "${{ matrix.build_features }}" --target "${{ matrix.target }}" --release

      - name: Stage native artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "native/${{ matrix.platform }}/debug"
          mkdir -p "native/${{ matrix.platform }}/release"
          cp "target/${{ matrix.target }}/debug/${{ matrix.lib_file }}" "native/${{ matrix.platform }}/debug/${{ matrix.lib_file }}"
          cp "target/${{ matrix.target }}/debug/${{ matrix.cli_file }}" "native/${{ matrix.platform }}/debug/${{ matrix.cli_file }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.lib_file }}" "native/${{ matrix.platform }}/release/${{ matrix.lib_file }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.cli_file }}" "native/${{ matrix.platform }}/release/${{ matrix.cli_file }}"

      - name: Archive native artifact with prefix
        shell: bash
        run: |
          set -euo pipefail
          archive="native-archive-${{ matrix.platform }}.tar.gz"
          tar -czf "${archive}" "native/${{ matrix.platform }}"
          for profile in debug release; do
            tar -tzf "${archive}" | grep -Fx "native/${{ matrix.platform }}/${profile}/${{ matrix.lib_file }}"
            tar -tzf "${archive}" | grep -Fx "native/${{ matrix.platform }}/${profile}/${{ matrix.cli_file }}"
          done

      - name: Upload native artifact
        uses: actions/upload-artifact@v5
        with:
          name: native-archive-${{ matrix.platform }}
          path: native-archive-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  build-jar:
    name: Assemble multi-platform jar
    runs-on: ubuntu-latest
    needs: [prepare, build-native]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.checkout_sha }}

      - name: Clean staged native resources
        run: rm -rf cobble-java/java/src/main/resources/native

      - name: Download all native artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: native-archive-*
          merge-multiple: true
          path: native-archives

      - name: Extract and verify native artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cobble-java/java/src/main/resources
          shopt -s nullglob
          archives=(native-archives/*.tar.gz)
          if [[ ${#archives[@]} -eq 0 ]]; then
            echo "No native archives downloaded." >&2
            exit 1
          fi
          for archive in "${archives[@]}"; do
            tar -xzf "${archive}" -C cobble-java/java/src/main/resources
          done

          while IFS= read -r file; do
            [[ -z "${file}" ]] && continue
            full_path="cobble-java/java/src/main/resources/${file}"
            if [[ ! -s "${full_path}" ]]; then
              echo "Missing or empty native artifact: ${full_path}" >&2
              exit 1
            fi
          done <<< "${EXPECTED_NATIVE_FILES}"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Java jar (skip local native build)
        working-directory: cobble-java/java
        run: ./mvnw --quiet -DskipTests -Dexec.skip=true -Dcobble.skip.local.native.copy=true package

      - name: Verify packaged native resources
        working-directory: cobble-java/java
        shell: bash
        run: |
          set -euo pipefail
          jar_file="$(find target -maxdepth 1 -type f -name 'cobble-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)"
          if [[ -z "${jar_file}" ]]; then
            echo "Missing assembled Cobble Java jar." >&2
            exit 1
          fi
          jar_contents="$(mktemp)"
          trap 'rm -f "${jar_contents}"' EXIT
          jar tf "${jar_file}" > "${jar_contents}"
          while IFS= read -r file; do
            [[ -z "${file}" ]] && continue
            grep -Fx "${file}" "${jar_contents}"
          done <<< "${EXPECTED_NATIVE_FILES}"

      - name: Upload jar artifact
        uses: actions/upload-artifact@v5
        with:
          name: cobble-java-multi-platform-jar
          path: cobble-java/java/target/cobble-*.jar
          if-no-files-found: error

  publish-packages:
    name: Publish Maven package
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [prepare, build-jar]
    env:
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.checkout_sha }}

      - name: Clean staged native resources
        run: rm -rf cobble-java/java/src/main/resources/native

      - name: Download all native artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: native-archive-*
          merge-multiple: true
          path: native-archives

      - name: Extract and verify native artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cobble-java/java/src/main/resources
          shopt -s nullglob
          archives=(native-archives/*.tar.gz)
          if [[ ${#archives[@]} -eq 0 ]]; then
            echo "No native archives downloaded." >&2
            exit 1
          fi
          for archive in "${archives[@]}"; do
            tar -xzf "${archive}" -C cobble-java/java/src/main/resources
          done

          while IFS= read -r file; do
            [[ -z "${file}" ]] && continue
            full_path="cobble-java/java/src/main/resources/${file}"
            if [[ ! -s "${full_path}" ]]; then
              echo "Missing or empty native artifact: ${full_path}" >&2
              exit 1
            fi
          done <<< "${EXPECTED_NATIVE_FILES}"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Maven Central credentials
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>central</id>
                <username>${MAVEN_CENTRAL_USERNAME}</username>
                <password>${MAVEN_CENTRAL_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Set release version from tag
        if: github.event_name == 'release'
        working-directory: cobble-java/java
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          ./mvnw --quiet versions:set -DnewVersion="${TAG}" -DgenerateBackupPoms=false

      - name: Verify SNAPSHOT version
        if: github.event_name == 'workflow_dispatch'
        working-directory: cobble-java/java
        run: |
          set -euo pipefail
          version="$(./mvnw --quiet help:evaluate -Dexpression=project.version -DforceStdout)"
          if [[ "${version}" != *-SNAPSHOT ]]; then
            echo "Refusing to publish non-SNAPSHOT version: ${version}" >&2
            exit 1
          fi

      - name: Import GPG key
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${MAVEN_GPG_PRIVATE_KEY}" || -z "${MAVEN_GPG_PASSPHRASE}" ]]; then
            echo "Missing MAVEN_GPG_PRIVATE_KEY or MAVEN_GPG_PASSPHRASE secret." >&2
            exit 1
          fi
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          if ! printf '%s' "${MAVEN_GPG_PRIVATE_KEY}" | gpg --batch --import; then
            printf '%s' "${MAVEN_GPG_PRIVATE_KEY}" | base64 --decode | gpg --batch --import
          fi
          echo "allow-loopback-pinentry" > ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent
          gpg --batch --list-secret-keys --keyid-format LONG

      - name: Publish to Maven Central (Portal plugin)
        working-directory: cobble-java/java
        run: ./mvnw --batch-mode -Prelease-publish -Dgpg.passphrase="${MAVEN_GPG_PASSPHRASE}" -DskipTests -Dexec.skip=true -Dcobble.skip.local.native.copy=true deploy -s ~/.m2/settings.xml
