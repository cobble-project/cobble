name: Python binding CI

on:
  push:
    paths:
      - "cobble-binding/cobble-python/**"
      - "cobble-binding/Cargo.toml"
      - "cobble-binding/src/**"
      - "cobble/**"
      - "cobble-data-structure/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/python-ci.yml"
  pull_request:
    paths:
      - "cobble-binding/cobble-python/**"
      - "cobble-binding/Cargo.toml"
      - "cobble-binding/src/**"
      - "cobble/**"
      - "cobble-data-structure/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/python-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Test native extension
        run: cargo test -p cobble-python
      - name: Lint native extension
        run: cargo clippy -p cobble-python --all-targets -- -D warnings

  wheel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Build CPython 3.11 stable-ABI wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          maturin-version: v1.14.1
          target: x86_64-unknown-linux-gnu
          manylinux: 2_28
          args: >-
            --release --locked --compatibility pypi --out dist
            --manifest-path cobble-binding/cobble-python/Cargo.toml
      - uses: actions/upload-artifact@v5
        with:
          name: pycobble-linux-x64-wheel
          path: dist/*.whl
          if-no-files-found: error

  python:
    needs: wheel
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v5
        with:
          name: pycobble-linux-x64-wheel
          path: dist
      - name: Install wheel and tests
        run: python -m pip install --find-links dist pycobble pytest
      - name: Run Python API tests
        run: pytest -q cobble-binding/cobble-python/tests

  s3-e2e:
    needs: wheel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v5
        with:
          name: pycobble-linux-x64-wheel
          path: dist
      - name: Install release wheel
        run: python -m pip install --find-links dist pycobble pytest
      - name: Start local S3 service
        run: |
          set -euo pipefail
          docker run -d --rm --name pycobble-s3 \
            -p 9000:9000 rustfs/rustfs:1.0.0-alpha.91
          for i in {1..60}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:9000/ || true)
            if [ "$code" != "000" ]; then
              exit 0
            fi
            sleep 2
          done
          docker logs pycobble-s3 || true
          exit 1
      - name: Create test bucket
        run: |
          set -euo pipefail
          aws_cli=(docker run --rm --network container:pycobble-s3
            -e AWS_ACCESS_KEY_ID=rustfsadmin
            -e AWS_SECRET_ACCESS_KEY=rustfsadmin
            -e AWS_DEFAULT_REGION=us-east-1
            amazon/aws-cli:2.31.18
            --endpoint-url http://127.0.0.1:9000)
          "${aws_cli[@]}" s3api create-bucket --bucket pycobble-test
      - name: Test raw and structured S3 recovery
        env:
          COBBLE_S3_ENDPOINT: http://127.0.0.1:9000
          COBBLE_S3_BUCKET: pycobble-test
          COBBLE_S3_ACCESS_ID: rustfsadmin
          COBBLE_S3_SECRET_KEY: rustfsadmin
        run: pytest -q cobble-binding/cobble-python/tests/test_s3.py
      - name: Stop local S3 service
        if: always()
        run: docker rm -f pycobble-s3 >/dev/null 2>&1 || true
