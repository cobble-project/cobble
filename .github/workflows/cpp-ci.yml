name: C++ binding CI

on:
  push:
    paths:
      - "cobble-binding/Cargo.toml"
      - "cobble-binding/src/**"
      - "cobble-binding/cobble-cpp/**"
      - "cobble/**"
      - "cobble-data-structure/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/cpp-ci.yml"
  pull_request:
    paths:
      - "cobble-binding/Cargo.toml"
      - "cobble-binding/src/**"
      - "cobble-binding/cobble-cpp/**"
      - "cobble/**"
      - "cobble-data-structure/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/cpp-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Test Rust bridge
        run: cargo test -p cobble-cpp
      - name: Lint Rust bridge
        run: cargo clippy -p cobble-cpp --all-targets -- -D warnings

  cpp:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure
        run: >-
          cmake -S cobble-binding/cobble-cpp -B build/cobble-cpp
          -DCMAKE_BUILD_TYPE=Release
          -DCOBBLE_CPP_BUILD_TESTS=ON
          -DCOBBLE_CPP_BUILD_EXAMPLES=ON
      - name: Build
        run: cmake --build build/cobble-cpp --config Release --parallel
      - name: Test
        run: ctest --test-dir build/cobble-cpp -C Release --output-on-failure
      - name: Install
        run: >-
          cmake --install build/cobble-cpp --config Release
          --prefix build/cobble-cpp-install

  s3-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Start local S3 service (RustFS)
        run: |
          set -euo pipefail
          docker run -d --rm --name cobble-cpp-s3 \
            -p 9000:9000 rustfs/rustfs:1.0.0-alpha.91
          for i in {1..60}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:9000/ || true)
            if [ "$code" != "000" ]; then
              exit 0
            fi
            sleep 2
          done
          docker logs cobble-cpp-s3 || true
          exit 1
      - name: Create test bucket
        run: |
          set -euo pipefail
          aws_cli=(docker run --rm --network container:cobble-cpp-s3
            -e AWS_ACCESS_KEY_ID=rustfsadmin
            -e AWS_SECRET_ACCESS_KEY=rustfsadmin
            -e AWS_DEFAULT_REGION=us-east-1
            amazon/aws-cli:2.31.18
            --endpoint-url http://127.0.0.1:9000)
          "${aws_cli[@]}" s3api head-bucket --bucket cobble-cpp-test ||
            "${aws_cli[@]}" s3api create-bucket --bucket cobble-cpp-test
      - name: Configure
        run: >-
          cmake -S cobble-binding/cobble-cpp -B build/cobble-cpp
          -DCMAKE_BUILD_TYPE=Release
          -DCOBBLE_CPP_BUILD_TESTS=ON
          -DCOBBLE_CPP_BUILD_S3_E2E_TEST=ON
          -DCOBBLE_CPP_CARGO_FEATURES=storage-s3
      - name: Build
        run: cmake --build build/cobble-cpp --config Release --parallel
      - name: Test S3 snapshot and resume
        env:
          COBBLE_S3_ENDPOINT: http://127.0.0.1:9000
          COBBLE_S3_BUCKET: cobble-cpp-test
          COBBLE_S3_ACCESS_ID: rustfsadmin
          COBBLE_S3_SECRET_KEY: rustfsadmin
        run: ctest --test-dir build/cobble-cpp -C Release -R cobble_cpp_s3_e2e --output-on-failure
      - name: Stop local S3 service
        if: always()
        run: docker rm -f cobble-cpp-s3 >/dev/null 2>&1 || true
