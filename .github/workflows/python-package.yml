name: Package Python binding

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  wheel:
    name: ${{ matrix.platform.name }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-24.04
            name: linux-x64
            target: x86_64-unknown-linux-gnu
            manylinux: 2_28
          - runner: ubuntu-24.04-arm
            name: linux-arm64
            target: aarch64-unknown-linux-gnu
            manylinux: 2_28
          - runner: macos-26
            name: macos-arm64
            target: aarch64-apple-darwin
            manylinux: "off"
          - runner: macos-26-intel
            name: macos-x64
            target: x86_64-apple-darwin
            manylinux: "off"
          - runner: windows-2025-vs2026
            name: windows-x64
            target: x86_64-pc-windows-msvc
            manylinux: "off"
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build stable-ABI wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          maturin-version: v1.14.1
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: >-
            --release --locked --compatibility pypi --out dist
            --manifest-path cobble-binding/cobble-python/Cargo.toml
      - name: Smoke-test wheel
        run: |
          python -m pip install --no-index --find-links dist pycobble
          python -c "import pycobble; print(pycobble.__version__)"
      - uses: actions/upload-artifact@v5
        with:
          name: pycobble-${{ matrix.platform.name }}
          path: dist/*.whl
          if-no-files-found: error

  source:
    name: source distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Build source distribution
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          maturin-version: v1.14.1
          args: >-
            --out dist
            --manifest-path cobble-binding/cobble-python/Cargo.toml
      - uses: actions/upload-artifact@v5
        with:
          name: pycobble-source
          path: dist/*.tar.gz
          if-no-files-found: error

  publish-release:
    name: Publish release assets
    if: github.event_name == 'release'
    needs: [wheel, source]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum pycobble-* > SHA256SUMS-pycobble
      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ github.event.release.tag_name }}"
          release-assets/*
