<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1100" role="img" aria-labelledby="table-title table-desc">
<title id="table-title">Distributed tables: typed writes and reads</title>
<desc id="table-desc">An optional catalog manages table definitions and storage locations. Each writer process has typed write support; each scan worker has typed read support using the selected snapshot's schema. Workers are on the left and coordinators on the right. Writers persist shard snapshots and report them for a global commit. The scan coordinator selects a global snapshot and distributes work to readers of the shared shard data.</desc>
<defs>
<marker id="arrow" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#655f55"/></marker>
<marker id="blue" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#3f6579"/></marker>
<marker id="brown" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#89643b"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#302d28}.label{font-size:16px;fill:#655f55}.body{font-size:20px}.name{font-size:22px;font-weight:600}.heading{font-family:Georgia,serif;font-size:36px}</style>
</defs>
