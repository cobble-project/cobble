<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 816" role="img" aria-labelledby="distributed-title distributed-desc">
<title id="distributed-title">Distributed write and snapshot coordination</title>
<desc id="distributed-desc">Three writer processes write immutable shard data files to shared storage and report shard snapshots to DbCoordinator, which writes the global manifest.</desc>
