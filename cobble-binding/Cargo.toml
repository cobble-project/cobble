[package]
name = "cobble-binding"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false
description = "Internal Rust import surface for Cobble language bindings."

[features]
default = []
storage-all = [
    "storage-alluxio",
    "storage-cos",
    "storage-ftp",
    "storage-goosefs",
    "storage-hdfs",
    "storage-oss",
    "storage-s3",
    "storage-sftp",
]
storage-alluxio = [
    "cobble/storage-alluxio",
    "cobble-data-structure/storage-alluxio",
]
storage-cos = [
    "cobble/storage-cos",
    "cobble-data-structure/storage-cos",
]
storage-ftp = [
    "cobble/storage-ftp",
    "cobble-data-structure/storage-ftp",
]
storage-goosefs = [
    "cobble/storage-goosefs",
    "cobble-data-structure/storage-goosefs",
]
storage-hdfs = [
    "cobble/storage-hdfs",
    "cobble-data-structure/storage-hdfs",
]
storage-oss = [
    "cobble/storage-oss",
    "cobble-data-structure/storage-oss",
]
storage-s3 = [
    "cobble/storage-s3",
    "cobble-data-structure/storage-s3",
]
storage-sftp = [
    "cobble/storage-sftp",
    "cobble-data-structure/storage-sftp",
]

[dependencies]
cobble = { workspace = true, features = ["ffi"] }
cobble-data-structure = { workspace = true, features = ["ffi"] }
