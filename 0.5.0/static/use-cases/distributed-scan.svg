<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 816" role="img" aria-labelledby="distributed-scan-title distributed-scan-desc">
<title id="distributed-scan-title">Distributed scan on one snapshot</title>
<desc id="distributed-scan-desc">A Scan Coordinator opens a global manifest and dispatches splits to staggered Scan Worker processes that read immutable shard data files from shared storage.</desc>
